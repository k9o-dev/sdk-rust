[package]
name = "k9o"
version = "1.3.0"
edition = "2021"
rust-version = "1.78"
description = "Kilimanjaro platform SDK — createClient + data DSL + projects + gate + studio (workflows/dashboards) + compute.llms + realtime subscriptions + KError. Rust idiomatic (snake_case; Result<Response<T>, KError>; reqwest async; SseStream async-iteration)."
homepage = "https://kilimanjaro.dev"
documentation = "https://docs.kilimanjaro.dev"
repository = "https://github.com/k9o-dev/sdk-rust"
license = "Apache-2.0"
keywords = ["kilimanjaro", "k9o", "sdk", "platform"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
async-trait = "0.1"
# vault-secrets wire `value` is base64 in both directions (live-verified,
# see src/kibo.rs); `percent-encoding` mirrors JS's
# `encodeURIComponent` for the hierarchical secret `name` path segment.
base64 = "0.22"
percent-encoding = "2.3"
# `time` only — used by the retry backoff sleep.
# The async SDK already runs on a tokio runtime supplied by the consumer.
tokio = { version = "1.40", features = ["time"], default-features = false }

[dev-dependencies]
tokio = { version = "1.40", features = ["full"] }
wiremock = "0.6"

[lib]
name = "k9o"
path = "src/lib.rs"
